[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lightnav-trajectory"
version = "0.1.0"
description = "Source-independent live 2D trajectory recording and browser display"
requires-python = ">=3.8"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lightnav_trajectory = ["web/*.js", "web/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
